version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/examples/app-observability"
    schedule:
      interval: "weekly"
    groups:
      reference-app-dependencies:
        patterns:
          - "*"
