services:
  otel-node-agent:
    image: otel/opentelemetry-collector-contrib:0.156.0@sha256:125bdbeb7590cc1952c5b3430ecf14063568980c2c93d5b38676cc0446ed8108
    user: "0:0"
    command: ["--config=/etc/otelcol/config/${NODE_AGENT_CONFIG_PROFILE:-profiles/otlp-only.yaml}"]
    environment:
      GATEWAY_OTLP_GRPC_ENDPOINT: ${GATEWAY_OTLP_GRPC_ENDPOINT:?set the gateway host and port}
      AGENT_HOST_NAME: ${AGENT_HOST_NAME:?set this node host name}
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-applications}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-production}
      NODE_AGENT_CONFIG_PROFILE: ${NODE_AGENT_CONFIG_PROFILE:-profiles/otlp-only.yaml}
    volumes:
      - ./config:/etc/otelcol/config:ro
      - otel-node-agent-state:/var/lib/otelcol
    restart: unless-stopped

volumes:
  otel-node-agent-state:
