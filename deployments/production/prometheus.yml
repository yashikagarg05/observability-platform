global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: "gateway-otel-exporter"
    static_configs:
      - targets:
          - otel-collector:8889

  - job_name: "gateway-self"
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: "loki"
    static_configs:
      - targets:
          - loki:3100

  - job_name: "tempo"
    static_configs:
      - targets:
          - tempo:3200
