<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Observability Platform overview</title>
  <desc id="description">Telemetry flows from applications and infrastructure through a Node Agent and OpenTelemetry Gateway to Loki, Prometheus, Tempo, and Grafana.</desc>
  <defs>
    <marker id="telemetry-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <linearGradient id="canvas-gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="path-gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas { fill: url(#canvas-gradient); }
      .path { fill: url(#path-gradient); stroke: #99f6e4; stroke-width: 1.5; filter: url(#soft-shadow); }
      .node { stroke-width: 1.75; filter: url(#soft-shadow); }
      .node-app { fill: #eff6ff; stroke: #2563eb; }
      .node-infra { fill: #fff7ed; stroke: #ea580c; }
      .node-agent { fill: #ecfdf5; stroke: #059669; }
      .node-gateway { fill: #ecfeff; stroke: #0891b2; }
      .node-loki { fill: #f5f3ff; stroke: #7c3aed; }
      .node-prometheus { fill: #fff1f2; stroke: #e11d48; }
      .node-tempo { fill: #eef2ff; stroke: #4f46e5; }
      .node-grafana { fill: #fffbeb; stroke: #f59e0b; }
      .title { fill: #0f172a; font: 700 28px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #475569; font: 400 15px Arial, Helvetica, sans-serif; }
      .section-label { fill: #0f766e; font: 700 12px Arial, Helvetica, sans-serif; letter-spacing: 1.5px; }
      .pill { fill: #ccfbf1; stroke: #5eead4; stroke-width: 1; }
      .pill-text { fill: #0f766e; font: 700 12px Arial, Helvetica, sans-serif; letter-spacing: 1.3px; }
      .node-title { fill: #0f172a; font: 700 16px Arial, Helvetica, sans-serif; }
      .node-text { fill: #475569; font: 400 12px Arial, Helvetica, sans-serif; }
      .node-small { fill: #64748b; font: 400 11px Arial, Helvetica, sans-serif; }
      .arrow-label { fill: #0f766e; font: 700 11px Arial, Helvetica, sans-serif; }
      .telemetry-line { fill: none; stroke: #0f766e; stroke-width: 2.6; stroke-linecap: round; marker-end: url(#telemetry-arrow); }
      .connector { fill: none; stroke: #99f6e4; stroke-width: 10; stroke-linecap: round; opacity: 0.55; }
    </style>
  </defs>

  <rect class="canvas" width="1200" height="500"/>
  <text class="title" x="48" y="54">Observability Platform</text>
  <text class="subtitle" x="48" y="82">A self-hosted telemetry layer that keeps applications decoupled from observability backends</text>

  <rect class="path" x="34" y="110" width="1132" height="342" rx="18"/>
  <rect class="pill" x="58" y="136" width="154" height="28" rx="14"/>
  <text class="pill-text" x="76" y="155">TELEMETRY PATH</text>

  <rect class="node node-app" x="70" y="190" width="190" height="84" rx="12"/>
  <text class="node-title" x="94" y="222">Applications</text>
  <text class="node-text" x="94" y="244">OTLP logs, metrics, traces</text>
  <text class="node-small" x="94" y="262">orders-api, payment-api, services</text>

  <rect class="node node-infra" x="70" y="312" width="190" height="96" rx="12"/>
  <text class="node-title" x="94" y="346">Infrastructure</text>
  <text class="node-text" x="94" y="368">Docker stdout, file logs,</text>
  <text class="node-text" x="94" y="386">host metrics</text>

  <rect class="node node-agent" x="330" y="244" width="194" height="110" rx="14"/>
  <text class="node-title" x="362" y="282">Node Agent</text>
  <text class="node-text" x="362" y="306">Local collection and</text>
  <text class="node-text" x="362" y="324">application OTLP intake</text>

  <rect class="node node-gateway" x="592" y="244" width="218" height="110" rx="14"/>
  <text class="node-title" x="620" y="282">OpenTelemetry Gateway</text>
  <text class="node-text" x="620" y="306">Normalize, enrich, batch,</text>
  <text class="node-text" x="620" y="324">and route telemetry</text>

  <rect class="node node-loki" x="880" y="168" width="168" height="70" rx="12"/>
  <text class="node-title" x="906" y="199">Loki</text>
  <text class="node-text" x="906" y="219">Logs</text>

  <rect class="node node-prometheus" x="880" y="264" width="168" height="70" rx="12"/>
  <text class="node-title" x="906" y="295">Prometheus</text>
  <text class="node-text" x="906" y="315">Metrics</text>

  <rect class="node node-tempo" x="880" y="360" width="168" height="70" rx="12"/>
  <text class="node-title" x="906" y="391">Tempo</text>
  <text class="node-text" x="906" y="411">Traces</text>

  <rect class="node node-grafana" x="1084" y="244" width="94" height="110" rx="14"/>
  <text class="node-title" x="1098" y="291">Grafana</text>
  <text class="node-text" x="1098" y="313">Explore</text>

  <path class="connector" d="M260 232 H330"/>
  <path class="telemetry-line" d="M260 232 H330"/>
  <text class="arrow-label" x="282" y="220">OTLP</text>
  <path class="connector" d="M260 360 H294 V316 H330"/>
  <path class="telemetry-line" d="M260 360 H294 V316 H330"/>
  <path class="connector" d="M524 299 H592"/>
  <path class="telemetry-line" d="M524 299 H592"/>
  <text class="arrow-label" x="542" y="287">OTLP</text>
  <text class="arrow-label" x="542" y="310">mTLS</text>
  <path class="connector" d="M810 299 H846 V203 H880"/>
  <path class="connector" d="M810 299 H880"/>
  <path class="connector" d="M810 299 H846 V395 H880"/>
  <path class="telemetry-line" d="M810 299 H846 V203 H880"/>
  <path class="telemetry-line" d="M810 299 H880"/>
  <path class="telemetry-line" d="M810 299 H846 V395 H880"/>
  <text class="arrow-label" x="828" y="282">route by signal</text>
  <path class="connector" d="M1048 203 H1066 V276 H1084"/>
  <path class="connector" d="M1048 299 H1084"/>
  <path class="connector" d="M1048 395 H1066 V322 H1084"/>
  <path class="telemetry-line" d="M1048 203 H1066 V276 H1084"/>
  <path class="telemetry-line" d="M1048 299 H1084"/>
  <path class="telemetry-line" d="M1048 395 H1066 V322 H1084"/>

</svg>
